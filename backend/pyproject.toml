[project]
name = "scri-copilot-backend"
version = "0.1.0"
description = "Sarah Cannon Research Institute (SCRI) Oncology Copilot - Backend API"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.19.2",
    "asyncpg==0.31.0",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "openai==3.13.0",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.5",
    "pydantic==2.13.5",
    "pydantic-ai==2.42.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy==2.0.52",
    "structlog==26.1.0",
    "supabase==2.31.0",
    "uvicorn==0.52.4",
]

[tool.uv]
add-bounds = "exact"
exclude-newer = "7 days"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs live Supabase + embedding API",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # Allow FastAPI Depends() in route defaults
    "E501",  # Allow long lines in clinical descriptions, SQL comments & logs
]


