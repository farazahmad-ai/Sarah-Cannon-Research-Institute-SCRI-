# A generic, single database configuration for Alembic.

[alembic]
# Path to migration scripts
script_location = alembic

# Prepend application root to sys.path so 'app' imports resolve cleanly
prepend_sys_path = .

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a .py file
# sourceless = false

# Version table name in the database
version_table = alembic_version

# Timezone to use when generating dates in migration files
timezone = UTC

# The URL is dynamically injected from app.config.settings in alembic/env.py.
# A placeholder is kept here for tooling that parses ini statically.
sqlalchemy.url = postgresql://placeholder

[post_write_hooks]
# Post-write hooks for formatting migrations (e.g. ruff)
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
